<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#030407"/>
  <defs>
    <pattern id="grid2" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grid2)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>
  <circle cx="600" cy="400" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="600" cy="400" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
</svg>
