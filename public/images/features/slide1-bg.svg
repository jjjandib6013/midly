<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#030407"/>
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030407" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grid1)"/>
  <rect width="1200" height="800" fill="url(#glow1)"/>
  <!-- Minimalist fingerprint lines -->
  <path d="M500,400 Q550,300 600,400 T700,400" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M480,420 Q550,340 600,420 T720,420" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
</svg>
